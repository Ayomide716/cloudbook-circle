name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch or PR cancels the run still in progress.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, types, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: One-file database setup is up to date with the migrations
        run: ./scripts/build-setup-sql.sh && git diff --exit-code supabase/setup/full-schema.sql
      - name: The pasteable media-upload function is up to date with its source
        run: node scripts/bundle-media-upload.mjs && git diff --exit-code supabase/functions/media-upload/dashboard-paste.ts

  e2e:
    name: End-to-end (phone)
    runs-on: ubuntu-latest
    needs: checks
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # A throwaway local Supabase built from supabase/migrations. The live project is never touched.
      - name: Start Supabase
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,postgres-meta

      # These are the CLI's fixed local-development keys, not the live project's.
      - name: Export local Supabase keys
        run: |
          supabase status -o env \
            | sed -nE 's/^(API_URL|ANON_KEY|SERVICE_ROLE_KEY|MAILPIT_URL)="(.*)"$/\1=\2/p' \
            | sed -e 's/^API_URL=/E2E_SUPABASE_URL=/' -e 's/^ANON_KEY=/E2E_SUPABASE_ANON_KEY=/' -e 's/^SERVICE_ROLE_KEY=/E2E_SUPABASE_SERVICE_KEY=/' -e 's/^MAILPIT_URL=/E2E_MAILPIT_URL=/' \
            >> "$GITHUB_ENV"

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

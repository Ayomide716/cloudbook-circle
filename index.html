<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- interactive-widget: Android shrinks the page above the on-screen keyboard instead of covering inputs. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>Ember — your people, closer</title>
    <meta name="description" content="Ember is where your people are: friends, groups, chats and reels in one warm, simple place." />
    <meta name="author" content="Ember" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://ayo-chat-xi.vercel.app/" />

    <!-- Fonts: connect early and load without blocking the first paint (display=swap). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Inter:wght@400;500;600;700;800&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Inter:wght@400;500;600;700;800&display=swap" /></noscript>

    <!-- Favicon -->
    <link rel="icon" href="/favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Open Graph -->
    <meta property="og:title" content="Ember — your people, closer" />
    <meta property="og:description" content="Friends, groups, chats and reels in one place. Your people, closer." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://ayo-chat-xi.vercel.app/" />
    <meta property="og:image" content="https://ayo-chat-xi.vercel.app/logo.png" />
    <meta property="og:site_name" content="Ember" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Ember — your people, closer" />
    <meta name="twitter:description" content="Friends, groups, chats and reels in one place. Your people, closer." />
    <meta name="twitter:image" content="https://ayo-chat-xi.vercel.app/logo.png" />

    <!-- The app's background from the very first frame (no white flash before the code loads). -->
    <style>
      html { background: #F8F5F0; }
      @media (prefers-color-scheme: dark) { html { background: #0C0C0E; } }
      html.light { background: #F8F5F0; }
      html.dark { background: #0C0C0E; }
    </style>


    <!-- Splash for the installed app: "ember." types itself out while the app loads. -->
    <style>
      #splash { position: fixed; inset: 0; z-index: 2147483647; display: flex; align-items: center; justify-content: center; background: #0C0C0E; transition: opacity .35s ease; }
      #splash[hidden] { display: none; }
      #splash.out { opacity: 0; pointer-events: none; }
      #splash .word { font-family: 'Bricolage Grotesque', 'Inter', system-ui, sans-serif; font-weight: 800; font-size: 56px; letter-spacing: -0.04em; color: #F5F1EA; line-height: 1; display: flex; align-items: center; }
      #splash .dot { color: #FF6A3D; display: inline-block; transform: scale(0); transition: transform .35s cubic-bezier(.3,1.6,.5,1); }
      #splash .dot.on { transform: scale(1); }
      #splash .caret { width: 4px; height: 52px; margin-left: 4px; border-radius: 2px; background: #FF6A3D; animation: splash-blink .8s steps(1) infinite; }
      #splash .caret.off { display: none; }
      @keyframes splash-blink { 50% { opacity: 0; } }
    </style>

    <!-- Theme Color -->
    <!-- The phone's status bar takes the header's colour, so the header runs to the top of the screen. -->
    <meta name="theme-color" content="#F8F5F0" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0C0C0E" media="(prefers-color-scheme: dark)" />

    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Ember",
      "url": "https://ayo-chat-xi.vercel.app",
      "description": "Friends, groups, chats and reels in one place.",
      "applicationCategory": "SocialNetworkingApplication",
      "operatingSystem": "Web",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      }
    }
    </script>
  </head>

  <body>
    <script>
      // Inside the Android app or the installed app: no scrollbars, as in native apps (index.css .app-shell).
      try { if ((window.matchMedia && matchMedia("(display-mode: standalone)").matches) || navigator.standalone === true || (window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform())) document.documentElement.classList.add("app-shell"); } catch (e) {}
    </script>
    <div id="splash" hidden aria-hidden="true"><span class="word"><span class="typed"></span><span class="dot">.</span><span class="caret"></span></span></div>
    <script>
      // Only when opened as the installed app (home-screen icon or the Android app), once per launch. ?splash=1 forces it.
      (function () {
        var el = document.getElementById("splash");
        // The Android app counts too (Capacitor is set up before this runs).
        var standalone = (window.matchMedia && matchMedia("(display-mode: standalone)").matches) || navigator.standalone === true || !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
        var forced = /[?&]splash=1/.test(location.search);
        var seen = false;
        try { seen = sessionStorage.getItem("ember_splash") === "1"; sessionStorage.setItem("ember_splash", "1"); } catch (e) {}
        if (!forced && (!standalone || seen)) { window.__hideSplash = function () {}; return; }
        el.hidden = false;
        // In the Android app, lift the dark launch screen now, so the typing is seen from the first letter.
        try { window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.SplashScreen && window.Capacitor.Plugins.SplashScreen.hide({ fadeOutDuration: 150 }); } catch (e) {}
        var typed = el.querySelector(".typed"), dot = el.querySelector(".dot"), caret = el.querySelector(".caret");
        var word = "ember", done = false, wantHide = false;
        var finish = function () { el.classList.add("out"); setTimeout(function () { el.remove(); }, 400); };
        window.__hideSplash = function () { wantHide = true; if (done) finish(); };
        var type = function (i) {
          if (i <= word.length) { typed.textContent = word.slice(0, i); setTimeout(function () { type(i + 1); }, i === 0 ? 220 : 130); return; }
          dot.classList.add("on");
          setTimeout(function () { caret.classList.add("off"); done = true; if (wantHide) setTimeout(finish, 300); }, 450);
        };
        // Wait briefly for the display font so the letters don't change shape mid-way.
        var start = function () { type(0); };
        if (document.fonts && document.fonts.load) {
          Promise.race([document.fonts.load('800 56px "Bricolage Grotesque"'), new Promise(function (r) { setTimeout(r, 700); })]).then(start, start);
        } else start();
        // Never get stuck on the splash.
        setTimeout(function () { wantHide = true; done = true; finish(); }, 4000);
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- interactive-widget: Android shrinks the page above the on-screen keyboard instead of covering inputs. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>Ember — your people, closer</title>
    <meta name="description" content="Ember is where your people are: friends, groups, chats and reels in one warm, simple place." />
    <meta name="author" content="Ember" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://ayo-chat-xi.vercel.app/" />

    <!-- Fonts: connect early and load without blocking the first paint (display=swap). -->

    <!-- Favicon -->
    <link rel="icon" href="/favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Open Graph -->
    <meta property="og:title" content="Ember — your people, closer" />
    <meta property="og:description" content="Friends, groups, chats and reels in one place. Your people, closer." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://ayo-chat-xi.vercel.app/" />
    <meta property="og:image" content="https://ayo-chat-xi.vercel.app/logo.png" />
    <meta property="og:site_name" content="Ember" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Ember — your people, closer" />
    <meta name="twitter:description" content="Friends, groups, chats and reels in one place. Your people, closer." />
    <meta name="twitter:image" content="https://ayo-chat-xi.vercel.app/logo.png" />

    <!-- The app's background from the very first frame (no white flash before the code loads). -->
    <style>
      html { background: #FFFFFF; }
      @media (prefers-color-scheme: dark) { html { background: #0C0C0E; } }
      html.light { background: #FFFFFF; }
      html.dark { background: #0C0C0E; }
    </style>


    <!-- Splash for the installed app: "ember." rises in letter by letter, the orange dot settles,
         and it all fades into the app. Light or dark, as the app will be. -->
    <style>
      #splash { --bg: #FFFFFF; --ink: #121212; --dot: #F2551C; position: fixed; inset: 0; z-index: 2147483647; display: flex; align-items: center; justify-content: center; background: var(--bg); transition: opacity .28s cubic-bezier(.23,1,.32,1), transform .28s cubic-bezier(.23,1,.32,1); }
      #splash.dark { --bg: #0C0C0E; --ink: #F4F4F5; --dot: #FF6929; }
      #splash[hidden] { display: none; }
      #splash.out { opacity: 0; transform: scale(1.03); pointer-events: none; }
      #splash .word { font-family: 'Figtree Variable', 'Figtree', system-ui, sans-serif; font-weight: 800; font-size: 56px; letter-spacing: -0.045em; color: var(--ink); line-height: 1.1; display: flex; overflow: hidden; padding-bottom: .08em; }
      #splash .l { display: inline-block; transform: translateY(105%); opacity: 0; animation: splash-rise .5s cubic-bezier(.23,1,.32,1) forwards; }
      #splash .dot { color: var(--dot); display: inline-block; transform: scale(.3); opacity: 0; animation: splash-dot .42s cubic-bezier(.34,1.56,.64,1) forwards; }
      #splash .l, #splash .dot { animation-play-state: paused; }
      #splash.go .l, #splash.go .dot { animation-play-state: running; }
      @keyframes splash-rise { to { transform: none; opacity: 1; } }
      @keyframes splash-dot { to { transform: none; opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { #splash .l, #splash .dot { animation: none; transform: none; opacity: 1; } #splash.out { transform: none; } }
    </style>

    <!-- Theme Color -->
    <!-- The phone's status bar takes the header's colour, so the header runs to the top of the screen. -->
    <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0C0C0E" media="(prefers-color-scheme: dark)" />

    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Ember",
      "url": "https://ayo-chat-xi.vercel.app",
      "description": "Friends, groups, chats and reels in one place.",
      "applicationCategory": "SocialNetworkingApplication",
      "operatingSystem": "Web",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      }
    }
    </script>
  </head>

  <body>
    <script>
      // Inside the Android app or the installed app: no scrollbars, as in native apps (index.css .app-shell).
      try { if ((window.matchMedia && matchMedia("(display-mode: standalone)").matches) || navigator.standalone === true || (window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform())) document.documentElement.classList.add("app-shell"); } catch (e) {}
    </script>
    <div id="splash" hidden aria-hidden="true"><span class="word"></span></div>
    <script>
      // Only when opened as the installed app (home-screen icon or the Android app), once per launch. ?splash=1 forces it.
      (function () {
        var el = document.getElementById("splash");
        // The Android app counts too (Capacitor is set up before this runs).
        var standalone = (window.matchMedia && matchMedia("(display-mode: standalone)").matches) || navigator.standalone === true || !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
        var forced = /[?&]splash=1/.test(location.search);
        var seen = false;
        try { seen = sessionStorage.getItem("ember_splash") === "1"; sessionStorage.setItem("ember_splash", "1"); } catch (e) {}
        if (!forced && (!standalone || seen)) { window.__hideSplash = function () {}; return; }
        // The theme the app is about to use: your choice in Settings, else the phone's.
        var theme = null;
        try { theme = localStorage.getItem("theme"); } catch (e) {}
        var dark = theme === "dark" || ((!theme || theme === "system") && window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) el.classList.add("dark");
        var word = el.querySelector(".word");
        "ember".split("").forEach(function (c, i) {
          var s = document.createElement("span"); s.className = "l"; s.textContent = c; s.style.animationDelay = (60 + i * 45) + "ms"; word.appendChild(s);
        });
        var dot = document.createElement("span"); dot.className = "dot"; dot.textContent = "."; dot.style.animationDelay = "380ms"; word.appendChild(dot);
        el.hidden = false;
        // In the Android app, lift the plain launch screen now (same colour), so the animation is seen from the start.
        try { window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.SplashScreen && window.Capacitor.Plugins.SplashScreen.hide({ fadeOutDuration: 0 }); } catch (e) {}
        // Shown for at least the animation (~0.8s), then as long as the app needs, then it fades into the app.
        // Start once the display font is in (at most 0.5s), so the letters don't change shape mid-way.
        var go = function () { el.classList.add("go"); };
        if (document.fonts && document.fonts.load) {
          Promise.race([document.fonts.load('800 56px "Figtree Variable"'), new Promise(function (r) { setTimeout(r, 500); })]).then(go, go);
        } else go();
        var shownAt = Date.now(), gone = false;
        var finish = function () { if (gone) return; gone = true; el.classList.add("out"); setTimeout(function () { el.remove(); }, 320); };
        window.__hideSplash = function () { setTimeout(finish, Math.max(0, 850 - (Date.now() - shownAt))); };
        // Never get stuck on the splash.
        setTimeout(finish, 4000);
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- interactive-widget: Android shrinks the page above the on-screen keyboard instead of covering inputs. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>Ember — your people, closer</title>
    <meta name="description" content="Ember is where your people are: friends, groups, chats and reels in one warm, simple place." />
    <meta name="author" content="Ember" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://ayo-chat-xi.vercel.app/" />

    <!-- Fonts: connect early and load without blocking the first paint (display=swap). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Inter:wght@400;500;600;700;800&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Inter:wght@400;500;600;700;800&display=swap" /></noscript>

    <!-- Favicon -->
    <link rel="icon" href="/favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Open Graph -->
    <meta property="og:title" content="Ember — your people, closer" />
    <meta property="og:description" content="Friends, groups, chats and reels in one place. Your people, closer." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://ayo-chat-xi.vercel.app/" />
    <meta property="og:image" content="https://ayo-chat-xi.vercel.app/logo.png" />
    <meta property="og:site_name" content="Ember" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Ember — your people, closer" />
    <meta name="twitter:description" content="Friends, groups, chats and reels in one place. Your people, closer." />
    <meta name="twitter:image" content="https://ayo-chat-xi.vercel.app/logo.png" />

    <!-- The app's background from the very first frame (no white flash before the code loads). -->
    <style>
      html { background: #F8F5F0; }
      @media (prefers-color-scheme: dark) { html { background: #0C0C0E; } }
      html.light { background: #F8F5F0; }
      html.dark { background: #0C0C0E; }
    </style>

    <!-- Theme Color -->
    <!-- The phone's status bar takes the header's colour, so the header runs to the top of the screen. -->
    <meta name="theme-color" content="#F8F5F0" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0C0C0E" media="(prefers-color-scheme: dark)" />

    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Ember",
      "url": "https://ayo-chat-xi.vercel.app",
      "description": "Friends, groups, chats and reels in one place.",
      "applicationCategory": "SocialNetworkingApplication",
      "operatingSystem": "Web",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      }
    }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
